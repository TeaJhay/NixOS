[shorturls]
gh = "github:{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.xz"
fj = "git+https://{path}"
ssh = "git+ssh://{path}"
manic = "github:manic-systems/{path}"
nix-community = "github:nix-community/{path}"

[all_follow]
hjem = "hjem"
nixpkgs = ["nixpkgs", "nixpkgs-lib", "nixpkgs-stable", "nixpkgs-unstable"]
[tack] 
recomposable = true
[omit_inputs]
[signers]
[inputs]

##[inputs.nixpkgs-unstable]
##url = "channel:nixos-unstable"
##
##[inputs.nixpkgs]
##url = "channel:nixos-26.05"

#NOTE: Base inputs
[inputs.nixpkgs]
url = "channel:nixos-unstable"
[inputs.secrets]
url = "ssh:forgejo@git-ssh.doesntcompute.site/TeaJhay/secrets.git"
type = "fetch"

#NOTE: Maniac preemo soft
[inputs.nixos-core]
url = "manic:nixos-core"
group = "manic-ware"
[inputs.hjem]
url = "gh:feel-co/hjem"
group = "manic-ware"
[inputs.hjem-rum]
url = "gh:snugnug/hjem-rum"
group = "manic-ware"
[inputs.tack]
url = "manic:tack"
group = "manic-ware"
[inputs.nh]
url   = "nix-community:nh"
group = "manic-ware"

#NOTE: Homelab
[inputs.circus]
url = "manic:circus"
exclude_follow = ["nixpkgs"]
group = "homelab"
[inputs.continuwuity]
url = "fj:forgejo.ellis.link/continuwuation/continuwuity"
exclude_follow = ["nixpkgs"]
group = "homelab"
[inputs.trilium]
url = "gh:TriliumNext/Trilium"
exclude_follow = ["nixpkgs"]
group = "homelab"
[inputs.authentik]
url = "nix-community:authentik-nix"
exclude_follow = ["nixpkgs"]
group = "homelab"

#NOTE: Extra utilities
[inputs.nixos-hardware]
url = "gh:NixOS/nixos-hardware/master"
group = "Extra"
[inputs.findFiles]
url = "gh:Michael-C-Buckley/findFiles.nix"
group = "Extra"
[inputs.niqspkgs]
url = "gh:diniamo/niqspkgs"
group = "Extra"
[inputs.hjem-impure]
url = "gh:Rexcrazy804/hjem-impure"
group = "Extra"
[inputs.nix-secrets]
url = "gh:unnamed-systems/nix-secrets"
group = "Extra"
[inputs.disko]
url = "nix-community:disko"
group = "Extra"

#NOTE: Graphical Environment
[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/cachix"
group = "Graphical Environment"
exclude_follow = ["nixpkgs"]
[inputs.noctalia-greeter]
url = "gh:noctalia-dev/noctalia-greeter"
group = "Graphical Environment"
exclude_follow = ["nixpkgs"]
[inputs.hyprland]
url = "gh:hyprwm/Hyprland"
group = "Graphical Environment"
exclude_follow = ["nixpkgs"]
[inputs.KvLibadwaita]
url  = "gh:GabePoel/KvLibadwaita"
type = "fetch"
group = "Graphical Environment"

#NOTE: Apps
[inputs.zen-browser]
url = "gh:youwen5/zen-browser-flake"
group = "Apps"
[inputs.millennium]
url = "gh:SteamClientHomebrew/Millennium"
dir = "packages/nix"
group = "Apps"
