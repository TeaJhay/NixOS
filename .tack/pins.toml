# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.xz"

# all_follow maps input names at every depth to the top-level pin they follow
# opt out per-input with exclude_follow, scope with flake: or tack:
[all_follow]
# nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
# names = ["flake-compat", "tack:cachix"]

# signers name the public keys pins can require, as an ssh key line, an
# armored pgp key, a file under .tack holding either, or an array of those.
# `tack signer add <name> --github <user>` fills one in from GitHub
[signers]
# alice = "ssh-ed25519 AAAA..."

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } immediate-input override map
#   exclude_follow  all_follow names to skip, flake:/tack: scoped or *
#   omit_inputs     upstream input names to omit recursively for this pin
#   keep_inputs     omitted input names to allow recursively for this pin
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
#   signers         names from [signers], one of whom must have signed the locked commit
#   patches         patch urls or files relative to this dir, applied in order
#   tag             follow the newest tag like "v{version}", where {version} is numbers
#                   joined by one separator, `.` `-` or `_`, used consistently so mixed
#                   tags are skipped, needs a github, gitlab or network git url with
#                   no ref or rev, not file://, or for a fixed pin a release
#                   download url naming the asset with {tag} or {version}
#   tags_from       fixed-only repo url or http(s) page to read tag's tags from, for an
#                   asset that isn't a release download
[inputs]

[inputs.nix-flatpak]
url = "github:gmodena/nix-flatpak"

[inputs.nixpkgs-lib]
url = "github:nix-community/nixpkgs.lib"

[inputs.nixpkgs-unstable]
url = "channel:nixpkgs-unstable"

[inputs.nixpkgs]
url = "channel:nixos-26.05"

[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware/master"

[inputs.preservation]
url = "github:nix-community/preservation"

[inputs.import-tree]
url = "github:denful/import-tree"

[inputs.findFiles]
url = "github:Michael-C-Buckley/findFiles.nix"

[inputs.niqspkgs]
url = "github:diniamo/niqspkgs"

[inputs.niqspkgs.follows]
nixpkgs-unstable = "nixpkgs-unstable"

[inputs.nix-secrets]
url = "github:unnamed-systems/nix-secrets"

[inputs.nix-secrets.follows]
nixpkgs-unstable = "nixpkgs-unstable"

[inputs.noctalia]
url = "github:noctalia-dev/noctalia/cachix"

[inputs.noctalia-greeter]
url = "github:noctalia-dev/noctalia-greeter"

[inputs.hyprland]
url = "github:hyprwm/Hyprland"

[inputs.disko]
url = "github:nix-community/disko"

[inputs.disko.follows]
nixpkgs = "nixpkgs"

[inputs.zen-browser]
url = "github:youwen5/zen-browser-flake"

[inputs.zen-browser.follows]
nxipkgs = "nxipkgs"

[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.hjem.follows]
nixpkgs = "nixpkgs"

[inputs.hjem-rum]
url = "github:snugnug/hjem-rum"

[inputs.hjem-rum.follows]
hjem = "hjem"

[inputs.hjem-impure]
url = "github:Rexcrazy804/hjem-impure"

[inputs.millennium]
url = "github:SteamClientHomebrew/Millennium"
dir = "packages/nix"

