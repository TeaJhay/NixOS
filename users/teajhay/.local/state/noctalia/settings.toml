config_version = 13

[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "top", "left", "right", "bottom" ]

    [bar.bottom]
    enabled = false
    position = "bottom"
    smart_auto_hide = true

    [bar.left]
    enabled = false
    position = "left"
    smart_auto_hide = true

    [bar.right]
    enabled = false
    position = "right"
    smart_auto_hide = true

    [bar.top]
    background_opacity = 0.19999999552965164
    center = [ "group:g1", "group:g6", "recorder" ]
    end = [ "tray", "clipboard", "group:g4", "group:g5", "network", "group:g2", "group:g3" ]
    font_family = "IBM Plex Sans"
    font_weight = 600
    start = [ "media", "audio_visualizer", "hypr-submap", "toggle" ]

        [[bar.top.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "launcher", "wallhaven", "wallpaper" ]
        opacity = 1.0
        padding = 6.0

        [[bar.top.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "volume", "input_volume" ]
        opacity = 1.0
        padding = 6.0

        [[bar.top.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "session", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.top.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "network_rx", "network_tx", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "ram", "cpu" ]
        opacity = 1.0
        padding = 6.0

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g6"
        members = [ "shelly", "notifications", "caffeine", "workspaces", "clock", "nightlight", "weather" ]
        opacity = 1.0
        padding = 6.0

