[plugins]
enabled = [
    "noctalia/wallhaven",
    "noctalia/bitwarden",
    "joshuaslate/shelly",
    "k4n4t4/hypr-submap",
    "decksters-lab/palette-creator",
    "noctalia/screen_recorder"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/anthonyhab/noctalia-plugins/"
    name = "custom"

[shell]
app_icon_color = "hover"
avatar_path = "/home/teejay/.config/hypr/Extras/TheMaxx2.png"
corner_radius_scale = 0.60000000894069672
external_ip_enabled = true
font_family = "IBM Plex Sans"
polkit_agent = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.animation]
    speed = 0.60000000894069672

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.session]
    grid_columns = 4

    [shell.shadow]
    alpha = 0.99999997764825821
    direction = "center"

[system.monitor]
cpu_freq_critical_threshold = 5.0

[theme]
builtin = "Tokyo-Night"
community_palette = "Garnet"
custom_palette = "Bloody-night"
pure_black_dark = true
source = "custom"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "btop" ]
    community_ids = [ "neovim", "prismlauncher", "steam" ]

[wallpaper]
directory = "/home/teejay/Pictures/wallpapers/"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/teejay/Pictures/wallpapers/Dreamy-Aesthetic-Home-Under-Moonlight.png"

    [wallpaper.last]
    path = "/home/teejay/Pictures/wallpapers/Dreamy-Aesthetic-Home-Under-Moonlight.png"

    [wallpaper.monitors.DP-3]
    path = "/home/teejay/Pictures/wallpapers/Dreamy-Aesthetic-Home-Under-Moonlight.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/teejay/Pictures/wallpapers/Dreamy-Aesthetic-Home-Under-Moonlight.png"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "/home/teejay/Pictures/wallpapers/3d-door.jpg"
    theme_mode = "dark"

[widget.audio_visualizer]
bands = 24
color_1 = "on_primary"
color_2 = "secondary"
width = 112

[widget.bluetooth]
show_label = true

[widget.clock]
format = "{:%-I:%M %p}"
tooltip_format = "%c"

    [widget.clock.actions]
    right = "settings-toggle"

[widget.cpu.actions]
right = "exec kitty btop"
scroll_down = "power-cycle prev"
scroll_up = "power-cycle next"

[widget.hypr-submap]
hide_when_default = true
type = "k4n4t4/hypr-submap:hypr-submap"

[widget.network.actions]
right = "exec kitty --class nmtui env NEWT_COLORS='root=white,black border=black,lightgray window=lightgray,lightgray title=black,lightgray button=black,cyan' nmtui &"

[widget.network_rx]
network_speed_compact = true
network_speed_unit = "mb"

    [widget.network_rx.actions]
    right = "panel-toggle control-center network"

[widget.network_tx.actions]
right = "panel-toggle control-center network"

[widget.notifications]
anchor = true

[widget.ram.actions]
right = "exec missioncenter"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.shelly]
type = "joshuaslate/shelly:shelly"

[widget.toggle]
type = "decksters-lab/palette-creator:toggle"

[widget.volume.actions]
left = "exec hyprpwcenter"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
focused_output_only = true
style = "focus_hint"

    [widget.workspaces.actions]
    right = "settings-open"