"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 2000
#$hostname\
#$username\
#[ ](fg:color_bg2 bg:color_bg2)\
format = """
[](fg:color_bg1)\
$os\
[ ](fg:color_bg1 bg:color_bg2)\
$directory\
[ ](fg:color_bg2 bg:color_bg3)\
$git_branch\
$git_status\
$c\
$dotnet\
$java\
$kotlin\
$nodejs\
[ ](fg:color_bg3 bg:color_bg5)\
$cmd_duration\
\n$character\
"""

palette = "ccswe_dark"

[palettes.ccswe_dark]
color_bg1 = "#9C152C"
color_bg2 = "#2959aa"
color_bg3 = "#7aa2f7"
color_bg4 = "#414868"
color_bg5 = "#1a1b26"

color_blue = "#769ff0"
color_gray = "#999999"
color_red = "#eb4d28"
color_white = "#f2f2f2"

[character]
error_symbol = "[❯](bold color_red)"
success_symbol = "[❯](bold color_blue)"

[cmd_duration]
format = "[$duration](bg:color_bg5 fg:color_gray)"
min_time = 500

[directory]
style = "bg:color_bg2 fg:color_white"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:color_bg3 fg:color_red"
format = "[$symbol $branch]($style)"

[git_status]
style = "bold bg:color_bg3 fg:color_red"
format = '([ $all_status$ahead_behind]($style))'
# Keep your existing commit status configurations
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
# Add ${count} to the file status indicators
modified = "⚑${count}"
untracked = "!${count}"
staged = "+${count}"
deleted = "${count}"

[hostname]
disabled = true
format = "[@$hostname]($style)"
ssh_only = true
ssh_symbol = " "
style = "bg:color_bg1 fg:color_white"

[os]
format = "[$symbol]($style)"
style = "bg:color_bg1 fg:color_white"
disabled = false

[username]
disabled = true
format = "[$user]($style)"
show_always = false
style_root = "bg:color_bg2 fg:color_red"
style_user = "bg:color_bg2 fg:color_white"

# Code symbols
[c]
format = '[$symbol]($style)'
style = "bg:color_bg4 fg:#6295CB"
symbol = " "

[dotnet]
format = '[$symbol]($style)'
style = "bg:color_bg4 fg:#1180C3"
symbol = " "

[java]
format = '[$symbol]($style)'
style = "bg:color_bg4 fg:#F7901E"
symbol = " "

[kotlin]
format = '[$symbol]($style)'
style = "bg:color_bg4 fg:#C017E4"
symbol = " "

[nodejs]
style = "bg:color_bg4 fg:#5FA04E"
format = '[$symbol($version)]($style)'
symbol = " "

