# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
#include ./kitty-themes/00-Default.conf

font_family monospace
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.75
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1
cursor_shape beam

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control yes

scrollback_lines 2000
wheel_scroll_min_lines 1

pixel_scroll yes
momentum_scroll 0.96

enable_audio_bell yes

window_padding_width 4

selection_foreground none
selection_background none

tab_bar_edge bottom
tab_bar_align left
tab_bar_style custom
tab_bar_custom_draw ~/.config/kitty/tab_bar.py
tab_bar_min_tabs 1
tab_activity_symbol none
bell_on_tab no
tab_separator ""
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_title_template "{f'{title[:30]}…' if title.rindex(title[-1]) + 1 > 30 else (title.center(6) if (title.rindex(title[-1]) + 1) % 2 == 0 else title.center(5))}"
active_tab_font_style bold
# foreground/background/cursor are set by the active theme

#include themes/Bloody-Night.conf
include themes/noctalia.conf
