name: Update Dependencies
"on":
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-tacks:
    name: update tacks and submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load NVF deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NVF_DEPLOY_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=flake:nixpkgs
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules
        run: git submodule update --init --remote

      - name: tack update
        run: nix --accept-flake-config run github:manic-systems/tack -- update

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          sign-commits: true
          commit-message: "chore: update tacks and submodules"
          title: "chore: update tacks and submodules"
          branch: automation/update-tacks
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
